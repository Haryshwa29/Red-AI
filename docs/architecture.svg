<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <style>
      .t{fill:#e6edf3} .m{fill:#8b949e} .xs{font-size:11px} .s{font-size:12px}
      .lbl{font-size:15px;font-weight:600} .sub{font-size:10.5px;fill:#8b949e}
      .box{fill:#161b22;stroke-width:1.5}
      @keyframes gatepulse{0%,100%{opacity:.35}50%{opacity:1}}
      #gateglow{animation:gatepulse 2.2s ease-in-out infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="860" fill="url(#bg)"/>
  <rect x="8" y="8" width="1264" height="844" rx="14" fill="none" stroke="#21262d"/>

  <!-- title -->
  <text x="40" y="46" class="t" font-size="24" font-weight="700">RED-AI <tspan class="m" font-size="15" font-weight="400">— autonomous security-testing pipeline</tspan></text>
  <text x="40" y="68" class="m s">The AI decides HOW to test · deterministic code decides WHAT is authorized · every action is gated and evidenced</text>

  <!-- authorization bar -->
  <rect x="40" y="88" width="1200" height="40" rx="8" fill="#1b1420" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="60" y="113" class="t s" font-weight="600">AUTHORIZATION</text>
  <text x="190" y="113" class="m s">signed Scope · operator identity (per-operator HMAC) · engagement type (pentest = full exploit · monitoring = prove-and-stop) — the gate enforces this before every action</text>

  <!-- strategist (brain) -->
  <rect x="318" y="150" width="258" height="60" rx="9" class="box" stroke="#a371f7"/>
  <text x="447" y="174" text-anchor="middle" class="t lbl">STRATEGIST (brain)</text>
  <text x="447" y="192" text-anchor="middle" class="sub">optional · the client's own LLM</text>
  <text x="447" y="204" text-anchor="middle" class="sub">reorders a closed set · can't author attacks</text>
  <path d="M447,210 L447,246" stroke="#a371f7" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="560" y="232" class="xs" fill="#a371f7">advisory only — error/refusal ⇒ deterministic fallback</text>

  <!-- authorization link down to the gate -->
  <path d="M700,128 L700,246" stroke="#f85149" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- ===== main spine ===== -->
  <!-- connector line (behind boxes) -->
  <line x1="97" y1="285" x2="1183" y2="285" stroke="#30363d" stroke-width="2"/>
  <!-- animated data pulses along the spine -->
  <circle r="5" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite" path="M97,285 H1183"/></circle>
  <circle r="5" fill="#3fb950" filter="url(#glow)"><animateMotion dur="5.5s" begin="1.8s" repeatCount="indefinite" path="M97,285 H1183"/></circle>
  <circle r="5" fill="#e3b341" filter="url(#glow)"><animateMotion dur="5.5s" begin="3.6s" repeatCount="indefinite" path="M97,285 H1183"/></circle>

  <!-- spine boxes: x = 32,197,362,527,692,857,1022 ; w=130 ; y=250 h=70 ; center y=285 -->
  <!-- OBJECTIVE -->
  <rect x="32" y="250" width="130" height="70" rx="9" class="box" stroke="#58a6ff"/>
  <text x="97" y="280" text-anchor="middle" class="t lbl">OBJECTIVE</text>
  <text x="97" y="300" text-anchor="middle" class="sub">onboarding ·</text>
  <text x="97" y="312" text-anchor="middle" class="sub">declared assets + flag</text>
  <!-- KNOWLEDGE -->
  <rect x="197" y="250" width="130" height="70" rx="9" class="box" stroke="#58a6ff"/>
  <text x="262" y="280" text-anchor="middle" class="t lbl">KNOWLEDGE</text>
  <text x="262" y="300" text-anchor="middle" class="sub">trusted facts vs</text>
  <text x="262" y="312" text-anchor="middle" class="sub">quarantined text</text>
  <!-- ROUTER -->
  <rect x="362" y="250" width="130" height="70" rx="9" class="box" stroke="#a371f7"/>
  <text x="427" y="283" text-anchor="middle" class="t lbl">CAPABILITY</text>
  <text x="427" y="300" text-anchor="middle" class="t lbl">ROUTER</text>
  <text x="427" y="314" text-anchor="middle" class="sub">closed set · native-first</text>
  <!-- GATE -->
  <rect id="gateglow" x="527" y="246" width="130" height="78" rx="9" fill="none" stroke="#f85149" stroke-width="3" filter="url(#glow)"/>
  <rect x="527" y="250" width="130" height="70" rx="9" class="box" stroke="#f85149"/>
  <text x="592" y="282" text-anchor="middle" class="t lbl">GATE</text>
  <text x="592" y="300" text-anchor="middle" class="sub">deterministic allow/deny</text>
  <text x="592" y="312" text-anchor="middle" class="sub">tier authority · fail-closed</text>
  <!-- EXECUTION -->
  <rect x="692" y="250" width="130" height="70" rx="9" class="box" stroke="#39d0d8"/>
  <text x="757" y="283" text-anchor="middle" class="t lbl">EXECUTION</text>
  <text x="757" y="300" text-anchor="middle" class="sub">runs the authorized</text>
  <text x="757" y="312" text-anchor="middle" class="sub">step via an engine</text>
  <!-- EVIDENCE -->
  <rect x="857" y="250" width="130" height="70" rx="9" class="box" stroke="#e3b341"/>
  <text x="922" y="283" text-anchor="middle" class="t lbl">EVIDENCE</text>
  <text x="922" y="300" text-anchor="middle" class="sub">hash-linked · timed</text>
  <text x="922" y="312" text-anchor="middle" class="sub">reproduction measured</text>
  <!-- REPORT -->
  <rect x="1022" y="250" width="130" height="70" rx="9" class="box" stroke="#3fb950"/>
  <text x="1087" y="283" text-anchor="middle" class="t lbl">REPORT</text>
  <text x="1087" y="300" text-anchor="middle" class="sub">confirmed findings +</text>
  <text x="1087" y="312" text-anchor="middle" class="sub">human-routed leads</text>

  <!-- execution -> engines -->
  <path d="M757,320 L757,372" stroke="#39d0d8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== engines band (hard-walled) ===== -->
  <rect x="300" y="384" width="560" height="150" rx="10" fill="#10151b" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="320" y="405" class="m s" font-weight="600">EXECUTION ENGINES</text>
  <text x="452" y="405" class="sub">— hard wall between them · each equally strong with or without external tools</text>

  <rect x="320" y="416" width="520" height="30" rx="7" class="box" stroke="#a371f7"/>
  <text x="334" y="436" class="t s" font-weight="600">LLM INJECTION</text>
  <text x="470" y="436" class="sub">prompt-injection skill · detector ladder · sim + live HTTP target adapter</text>

  <rect x="320" y="452" width="520" height="30" rx="7" class="box" stroke="#58a6ff"/>
  <text x="334" y="472" class="t s" font-weight="600">RECON</text>
  <text x="470" y="472" class="sub">TCP connect scan → service / version ID → web-surface enumeration</text>

  <rect x="320" y="488" width="520" height="30" rx="7" class="box" stroke="#f0883e"/>
  <text x="334" y="508" class="t s" font-weight="600">EXPLOIT</text>
  <text x="470" y="508" class="sub">controller · gated modules (native-first) → capture-the-flag</text>

  <!-- engines -> target -->
  <path d="M860,459 L944,459" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle r="4.5" fill="#39d0d8" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M757,320 L757,459 L944,459"/></circle>

  <!-- target -->
  <rect x="944" y="420" width="196" height="78" rx="10" class="box" stroke="#8b949e"/>
  <text x="1042" y="452" text-anchor="middle" class="t lbl">TARGET</text>
  <text x="1042" y="472" text-anchor="middle" class="sub">sandbox / replica — the</text>
  <text x="1042" y="484" text-anchor="middle" class="sub">system under test</text>

  <!-- target raw output -> quarantine (trust split) -->
  <path d="M944,430 C700,360 480,360 327,300" fill="none" stroke="#f85149" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity="0.8"/>
  <circle r="4" fill="#f85149" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M944,430 C700,360 480,360 327,300"/></circle>
  <text x="560" y="350" class="xs" fill="#f85149">raw target output ⇒ quarantined (can never steer planning)</text>

  <!-- ===== learning back-flow ===== -->
  <path d="M922,320 C922,620 262,640 262,322" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.85"/>
  <circle r="4.5" fill="#3fb950" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M922,320 C922,620 262,640 262,322"/></circle>
  <text x="592" y="648" text-anchor="middle" class="s" fill="#3fb950">learning back-flow — recurring generic capabilities proposed upstream to V0 · human-gated · client data never leaves</text>

  <!-- ===== footer: principles / legend ===== -->
  <text x="40" y="712" class="m s" font-weight="600">STRUCTURAL GUARANTEES</text>
  <text x="40" y="734" class="m xs">◆ the target cannot steer the engine (knowledge trust-split)   ◆ the brain cannot widen authority (closed-set routing + the gate authorizes every action)</text>
  <text x="40" y="752" class="m xs">◆ a refusing / absent brain changes ordering only, not the verdict   ◆ offline · zero third-party dependencies · no data egress</text>

  <text x="40" y="792" class="m s" font-weight="600">CHECKPOINT 1</text>
  <text x="140" y="792" class="xs" fill="#3fb950">reached — pipeline built &amp; lab-proven (157 offline tests)</text>
  <text x="40" y="810" class="m s" font-weight="600">CHECKPOINT 2</text>
  <text x="140" y="810" class="m xs">pending — first confirmed capture on a live range box (TryHackMe / HackTheBox)</text>

  <!-- node legend (right) -->
  <g transform="translate(900,700)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="none" stroke="#58a6ff"/><text x="20" y="10" class="m xs">knowledge</text>
    <rect x="0" y="22" width="12" height="12" rx="3" fill="none" stroke="#a371f7"/><text x="20" y="32" class="m xs">intelligence</text>
    <rect x="0" y="44" width="12" height="12" rx="3" fill="none" stroke="#f85149"/><text x="20" y="54" class="m xs">control / authority</text>
    <rect x="160" y="0" width="12" height="12" rx="3" fill="none" stroke="#f0883e"/><text x="180" y="10" class="m xs">exploit</text>
    <rect x="160" y="22" width="12" height="12" rx="3" fill="none" stroke="#e3b341"/><text x="180" y="32" class="m xs">evidence</text>
    <rect x="160" y="44" width="12" height="12" rx="3" fill="none" stroke="#3fb950"/><text x="180" y="54" class="m xs">output / learning</text>
  </g>
</svg>
