<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1320" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t{fill:#e6edf3}.m{fill:#9aa4b2}
      .lbl{font-size:19px;font-weight:700;fill:#e6edf3}
      .sub{font-size:13.5px;fill:#9aa4b2}
      .s{font-size:15px}.xs{font-size:12.5px}
      .box{fill:#161b22;stroke-width:2}
      @keyframes gp{0%,100%{opacity:.3}50%{opacity:1}}
      #gg{animation:gp 2.2s ease-in-out infinite}
    </style>
  </defs>

  <rect width="840" height="1320" fill="url(#bg)"/>
  <rect x="8" y="8" width="824" height="1304" rx="14" fill="none" stroke="#21262d"/>

  <text x="32" y="48" class="t" font-size="29" font-weight="800">RED-AI</text>
  <text x="188" y="48" class="m" font-size="17">— autonomous security-testing pipeline</text>
  <text x="32" y="74" class="m" font-size="14">The AI decides HOW · deterministic code decides WHAT is authorized · every action gated &amp; evidenced</text>

  <!-- authorization band -->
  <rect x="32" y="92" width="776" height="60" rx="10" fill="#1b1420" stroke="#f85149" stroke-opacity="0.55" stroke-width="2"/>
  <text x="52" y="118" class="t s" font-weight="700">AUTHORIZATION</text>
  <text x="200" y="117" class="m" font-size="13.5">signed Scope · operator identity (per-operator HMAC) · engagement type</text>
  <text x="200" y="137" class="m" font-size="13.5">pentest = full exploit · monitoring = prove-and-stop — enforced before every action</text>

  <!-- vertical spine connector + descending pulses (center x=330) -->
  <line x1="330" y1="214" x2="330" y2="1104" stroke="#30363d" stroke-width="2.5"/>
  <circle r="6" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M330,214 V1104"/></circle>
  <circle r="6" fill="#e3b341" filter="url(#glow)"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M330,214 V1104"/></circle>
  <circle r="6" fill="#3fb950" filter="url(#glow)"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M330,214 V1104"/></circle>

  <!-- spine boxes: x=130 w=400 center 330 -->
  <!-- 1 OBJECTIVE -->
  <rect x="130" y="176" width="400" height="66" rx="10" class="box" stroke="#58a6ff"/>
  <text x="330" y="208" text-anchor="middle" class="lbl">OBJECTIVE / ONBOARDING</text>
  <text x="330" y="229" text-anchor="middle" class="sub">declared assets · canary / flag</text>
  <path d="M330,242 V294" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 KNOWLEDGE -->
  <rect x="130" y="296" width="400" height="66" rx="10" class="box" stroke="#58a6ff"/>
  <text x="330" y="328" text-anchor="middle" class="lbl">KNOWLEDGE SYSTEM</text>
  <text x="330" y="349" text-anchor="middle" class="sub">trusted facts  vs  quarantined target text</text>
  <path d="M330,362 V414" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 ROUTER + strategist chip -->
  <rect x="130" y="416" width="400" height="66" rx="10" class="box" stroke="#a371f7"/>
  <text x="330" y="448" text-anchor="middle" class="lbl">CAPABILITY ROUTER</text>
  <text x="330" y="469" text-anchor="middle" class="sub">closed set · native-first · explainable</text>

  <rect x="560" y="410" width="248" height="78" rx="10" class="box" stroke="#a371f7"/>
  <text x="684" y="434" text-anchor="middle" class="t s" font-weight="700">STRATEGIST (brain)</text>
  <text x="684" y="452" text-anchor="middle" class="sub">optional · the client's own LLM</text>
  <text x="684" y="468" text-anchor="middle" class="sub">reorders a closed set</text>
  <text x="684" y="482" text-anchor="middle" class="sub">error/refusal ⇒ deterministic fallback</text>
  <path d="M560,449 H534" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="548" y="402" text-anchor="middle" class="xs" fill="#a371f7">advisory · reorder-only</text>

  <path d="M330,482 V534" stroke="#a371f7" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 GATE -->
  <rect id="gg" x="130" y="532" width="400" height="74" rx="10" fill="none" stroke="#f85149" stroke-width="3.5" filter="url(#glow)"/>
  <rect x="130" y="536" width="400" height="66" rx="10" class="box" stroke="#f85149"/>
  <text x="330" y="568" text-anchor="middle" class="lbl">GATE</text>
  <text x="330" y="589" text-anchor="middle" class="sub">deterministic allow / deny · tier authority · fail-closed</text>
  <path d="M330,606 V658" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 EXECUTION ENGINES group + target -->
  <rect x="130" y="660" width="400" height="188" rx="12" fill="#10151b" stroke="#30363d" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="150" y="684" class="m s" font-weight="700">EXECUTION ENGINES <tspan class="sub">— hard-walled · native-first</tspan></text>

  <rect x="146" y="694" width="368" height="42" rx="8" class="box" stroke="#a371f7"/>
  <text x="162" y="712" class="t s" font-weight="700">LLM INJECTION</text>
  <text x="162" y="728" class="sub">prompt-injection · sim + live HTTP target</text>

  <rect x="146" y="742" width="368" height="42" rx="8" class="box" stroke="#58a6ff"/>
  <text x="162" y="760" class="t s" font-weight="700">RECON</text>
  <text x="162" y="776" class="sub">connect scan → service / version ID → web enum</text>

  <rect x="146" y="790" width="368" height="42" rx="8" class="box" stroke="#f0883e"/>
  <text x="162" y="808" class="t s" font-weight="700">EXPLOIT</text>
  <text x="162" y="824" class="sub">gated modules (native-first) → capture-the-flag</text>

  <!-- target -->
  <rect x="560" y="712" width="248" height="80" rx="10" class="box" stroke="#8b949e"/>
  <text x="684" y="744" text-anchor="middle" class="lbl" font-size="18">TARGET</text>
  <text x="684" y="765" text-anchor="middle" class="sub">sandbox / replica</text>
  <text x="684" y="781" text-anchor="middle" class="sub">the system under test</text>
  <path d="M530,756 H556" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <circle r="5" fill="#39d0d8" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M330,606 V756 H556"/></circle>

  <!-- quarantine: target raw output -> knowledge (clear left corridor of the right block) -->
  <path d="M576,712 C548,640 548,430 534,356" fill="none" stroke="#f85149" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arr)" opacity="0.85"/>
  <circle r="4.5" fill="#f85149" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M576,712 C548,640 548,430 534,356"/></circle>
  <text x="684" y="588" text-anchor="middle" class="xs" fill="#f85149">raw target output ⇒ quarantined</text>
  <text x="684" y="605" text-anchor="middle" class="xs" fill="#f85149">— can never steer planning</text>

  <path d="M330,848 V900" stroke="#39d0d8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 6 EVIDENCE -->
  <rect x="130" y="902" width="400" height="66" rx="10" class="box" stroke="#e3b341"/>
  <text x="330" y="934" text-anchor="middle" class="lbl">EVIDENCE</text>
  <text x="330" y="955" text-anchor="middle" class="sub">hash-linked · timestamped · reproduction measured</text>
  <path d="M330,968 V1020" stroke="#e3b341" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 7 REPORT -->
  <rect x="130" y="1022" width="400" height="66" rx="10" class="box" stroke="#3fb950"/>
  <text x="330" y="1054" text-anchor="middle" class="lbl">REPORT</text>
  <text x="330" y="1075" text-anchor="middle" class="sub">confirmed findings + human-routed leads</text>

  <!-- learning back-flow: evidence -> knowledge (left margin) -->
  <path d="M130,935 C44,935 44,329 130,329" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr)" opacity="0.9"/>
  <circle r="5" fill="#3fb950" filter="url(#glow)"><animateMotion dur="6.5s" repeatCount="indefinite" path="M130,935 C44,935 44,329 130,329"/></circle>
  <text x="40" y="632" class="xs" fill="#3fb950" transform="rotate(-90 40 632)">learning back-flow — generic capabilities → V0 · human-gated</text>

  <!-- footer -->
  <text x="32" y="1142" class="m s" font-weight="700">STRUCTURAL GUARANTEES</text>
  <text x="32" y="1166" class="m xs">◆ the target cannot steer the engine (knowledge trust-split)</text>
  <text x="32" y="1186" class="m xs">◆ the brain cannot widen authority (closed set + gate authorizes every action)</text>
  <text x="32" y="1206" class="m xs">◆ a refusing / absent brain changes ordering only, not the verdict</text>
  <text x="32" y="1226" class="m xs">◆ offline · zero third-party dependencies · no data egress</text>

  <text x="32" y="1264" class="s" font-weight="700" fill="#3fb950">CHECKPOINT 1 <tspan class="m" font-weight="400">— reached: pipeline built &amp; lab-proven (157 offline tests)</tspan></text>
  <text x="32" y="1288" class="m s" font-weight="700">CHECKPOINT 2 <tspan font-weight="400">— pending: first confirmed capture on a live range box</tspan></text>

  <!-- legend -->
  <g transform="translate(560,1150)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="none" stroke="#58a6ff" stroke-width="2"/><text x="22" y="11" class="m xs">knowledge</text>
    <rect x="130" y="0" width="13" height="13" rx="3" fill="none" stroke="#a371f7" stroke-width="2"/><text x="152" y="11" class="m xs">intelligence</text>
    <rect x="0" y="24" width="13" height="13" rx="3" fill="none" stroke="#f85149" stroke-width="2"/><text x="22" y="35" class="m xs">control</text>
    <rect x="130" y="24" width="13" height="13" rx="3" fill="none" stroke="#f0883e" stroke-width="2"/><text x="152" y="35" class="m xs">exploit</text>
    <rect x="0" y="48" width="13" height="13" rx="3" fill="none" stroke="#e3b341" stroke-width="2"/><text x="22" y="59" class="m xs">evidence</text>
    <rect x="130" y="48" width="13" height="13" rx="3" fill="none" stroke="#3fb950" stroke-width="2"/><text x="152" y="59" class="m xs">output / learning</text>
  </g>
</svg>
