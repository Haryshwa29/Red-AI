<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t{fill:#e6edf3} .m{fill:#9aa4b2}
      .lbl{font-size:19px;font-weight:700;fill:#e6edf3}
      .sub{font-size:13px;fill:#9aa4b2}
      .s{font-size:15px} .xs{font-size:13px}
      .box{fill:#161b22;stroke-width:2}
      @keyframes gatepulse{0%,100%{opacity:.3}50%{opacity:1}}
      #gateglow{animation:gatepulse 2.2s ease-in-out infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="url(#bg)"/>
  <rect x="8" y="8" width="1224" height="864" rx="14" fill="none" stroke="#21262d"/>

  <!-- title -->
  <text x="40" y="52" class="t" font-size="30" font-weight="800">RED-AI <tspan class="m" font-size="18" font-weight="400">— autonomous security-testing pipeline</tspan></text>
  <text x="40" y="78" class="m s">The AI decides HOW to test · deterministic code decides WHAT is authorized · every action is gated and evidenced</text>

  <!-- authorization bar -->
  <rect x="40" y="96" width="1160" height="46" rx="9" fill="#1b1420" stroke="#f85149" stroke-opacity="0.55" stroke-width="2"/>
  <text x="62" y="124" class="t s" font-weight="700">AUTHORIZATION</text>
  <text x="210" y="124" class="m s">signed Scope · operator identity (per-operator HMAC) · engagement type (pentest = full exploit · monitoring = prove-and-stop)</text>

  <!-- strategist (brain) -->
  <rect x="300" y="158" width="308" height="66" rx="10" class="box" stroke="#a371f7"/>
  <text x="454" y="186" text-anchor="middle" class="lbl" font-size="17">STRATEGIST (brain)</text>
  <text x="454" y="206" text-anchor="middle" class="sub">optional · the client's own LLM</text>
  <text x="454" y="220" text-anchor="middle" class="sub">reorders a closed set · never authors attacks</text>
  <path d="M454,224 L454,256" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="596" y="246" class="xs" fill="#a371f7">advisory · error/refusal ⇒ deterministic fallback</text>

  <!-- authorization enforced at the gate -->
  <path d="M700,142 L700,256" stroke="#f85149" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.6"/>
  <text x="708" y="200" class="xs" fill="#f85149">enforced here</text>

  <!-- ===== main spine ===== -->
  <line x1="110" y1="300" x2="1142" y2="300" stroke="#30363d" stroke-width="2.5"/>
  <circle r="6" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite" path="M110,300 H1142"/></circle>
  <circle r="6" fill="#3fb950" filter="url(#glow)"><animateMotion dur="5.5s" begin="1.8s" repeatCount="indefinite" path="M110,300 H1142"/></circle>
  <circle r="6" fill="#e3b341" filter="url(#glow)"><animateMotion dur="5.5s" begin="3.6s" repeatCount="indefinite" path="M110,300 H1142"/></circle>

  <!-- boxes: x=35,207,379,551,723,895,1067 ; w=150 ; y=262 h=76 ; center y=300 ; centers 110,282,454,626,798,970,1142 -->
  <rect x="35" y="262" width="150" height="76" rx="10" class="box" stroke="#58a6ff"/>
  <text x="110" y="298" text-anchor="middle" class="lbl">OBJECTIVE</text>
  <text x="110" y="320" text-anchor="middle" class="sub">assets + flag</text>

  <rect x="207" y="262" width="150" height="76" rx="10" class="box" stroke="#58a6ff"/>
  <text x="282" y="298" text-anchor="middle" class="lbl">KNOWLEDGE</text>
  <text x="282" y="320" text-anchor="middle" class="sub">facts ⟂ quarantine</text>

  <rect x="379" y="262" width="150" height="76" rx="10" class="box" stroke="#a371f7"/>
  <text x="454" y="292" text-anchor="middle" class="lbl" font-size="17">CAPABILITY</text>
  <text x="454" y="311" text-anchor="middle" class="lbl" font-size="17">ROUTER</text>
  <text x="454" y="329" text-anchor="middle" class="sub">closed · native-first</text>

  <rect id="gateglow" x="551" y="258" width="150" height="84" rx="10" fill="none" stroke="#f85149" stroke-width="3.5" filter="url(#glow)"/>
  <rect x="551" y="262" width="150" height="76" rx="10" class="box" stroke="#f85149"/>
  <text x="626" y="298" text-anchor="middle" class="lbl">GATE</text>
  <text x="626" y="320" text-anchor="middle" class="sub">fail-closed authority</text>

  <rect x="723" y="262" width="150" height="76" rx="10" class="box" stroke="#39d0d8"/>
  <text x="798" y="298" text-anchor="middle" class="lbl">EXECUTION</text>
  <text x="798" y="320" text-anchor="middle" class="sub">authorized step</text>

  <rect x="895" y="262" width="150" height="76" rx="10" class="box" stroke="#e3b341"/>
  <text x="970" y="298" text-anchor="middle" class="lbl">EVIDENCE</text>
  <text x="970" y="320" text-anchor="middle" class="sub">hash-linked · timed</text>

  <rect x="1067" y="262" width="150" height="76" rx="10" class="box" stroke="#3fb950"/>
  <text x="1142" y="298" text-anchor="middle" class="lbl">REPORT</text>
  <text x="1142" y="320" text-anchor="middle" class="sub">findings + leads</text>

  <!-- execution -> engines -->
  <path d="M798,338 L798,392" stroke="#39d0d8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== engines band ===== -->
  <rect x="300" y="404" width="628" height="156" rx="12" fill="#10151b" stroke="#30363d" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="320" y="428" class="m s" font-weight="700">EXECUTION ENGINES <tspan class="sub">— hard-walled · each first-class with or without external tools</tspan></text>

  <rect x="320" y="440" width="588" height="32" rx="8" class="box" stroke="#a371f7"/>
  <text x="336" y="461" class="t s" font-weight="700">LLM INJECTION</text>
  <text x="486" y="461" class="sub">prompt-injection skill · detector ladder · sim + live HTTP target</text>

  <rect x="320" y="478" width="588" height="32" rx="8" class="box" stroke="#58a6ff"/>
  <text x="336" y="499" class="t s" font-weight="700">RECON</text>
  <text x="486" y="499" class="sub">TCP connect scan → service / version ID → web enumeration</text>

  <rect x="320" y="516" width="588" height="32" rx="8" class="box" stroke="#f0883e"/>
  <text x="336" y="537" class="t s" font-weight="700">EXPLOIT</text>
  <text x="486" y="537" class="sub">controller · gated modules (native-first) → capture-the-flag</text>

  <!-- engines -> target -->
  <path d="M928,494 L1000,494" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="5" fill="#39d0d8" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M798,338 L798,494 L1000,494"/></circle>

  <!-- target -->
  <rect x="1000" y="452" width="200" height="84" rx="11" class="box" stroke="#8b949e"/>
  <text x="1100" y="488" text-anchor="middle" class="lbl" font-size="18">TARGET</text>
  <text x="1100" y="510" text-anchor="middle" class="sub">sandbox / replica</text>
  <text x="1100" y="524" text-anchor="middle" class="sub">the system under test</text>

  <!-- raw output -> quarantine (trust split) -->
  <path d="M1000,462 C740,384 520,384 357,330" fill="none" stroke="#f85149" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.85"/>
  <circle r="4.5" fill="#f85149" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M1000,462 C740,384 520,384 357,330"/></circle>
  <text x="600" y="376" class="xs" fill="#f85149">raw target output ⇒ quarantined — can never steer planning</text>

  <!-- learning back-flow -->
  <path d="M970,338 C970,660 282,680 282,340" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" opacity="0.9"/>
  <circle r="5" fill="#3fb950" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M970,338 C970,660 282,680 282,340"/></circle>
  <text x="626" y="686" text-anchor="middle" class="s" fill="#3fb950">learning back-flow — recurring generic capabilities proposed upstream to V0 · human-gated · client data never leaves</text>

  <!-- footer -->
  <text x="40" y="742" class="m s" font-weight="700">STRUCTURAL GUARANTEES</text>
  <text x="40" y="766" class="m xs">◆ the target cannot steer the engine (knowledge trust-split)    ◆ the brain cannot widen authority (closed-set routing + the gate authorizes every action)</text>
  <text x="40" y="786" class="m xs">◆ a refusing / absent brain changes ordering only, not the verdict    ◆ offline · zero third-party dependencies · no data egress</text>

  <text x="40" y="828" class="s" font-weight="700" fill="#3fb950">CHECKPOINT 1 <tspan class="m" font-weight="400">— reached: pipeline built &amp; lab-proven (157 offline tests)</tspan></text>
  <text x="40" y="850" class="m s" font-weight="700">CHECKPOINT 2 <tspan font-weight="400">— pending: first confirmed capture on a live range box (TryHackMe / HackTheBox)</tspan></text>

  <!-- legend -->
  <g transform="translate(980,800)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="none" stroke="#58a6ff" stroke-width="2"/><text x="22" y="11" class="m xs">knowledge</text>
    <rect x="0" y="22" width="13" height="13" rx="3" fill="none" stroke="#a371f7" stroke-width="2"/><text x="22" y="33" class="m xs">intelligence</text>
    <rect x="140" y="0" width="13" height="13" rx="3" fill="none" stroke="#f85149" stroke-width="2"/><text x="162" y="11" class="m xs">control</text>
    <rect x="140" y="22" width="13" height="13" rx="3" fill="none" stroke="#e3b341" stroke-width="2"/><text x="162" y="33" class="m xs">evidence</text>
  </g>
</svg>
